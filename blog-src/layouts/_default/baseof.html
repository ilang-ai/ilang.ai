<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}iLang Blog — The iLang Journal{{ else }}{{ .Title }} — iLang Blog{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}iLang Blog{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:image" content="https://ilang.ai/ilang-logo.png">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="/ilang-logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="/ilang-favicon.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/inter@5.0.17/400.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/inter@5.0.17/500.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/inter@5.0.17/600.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/inter@5.0.17/700.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/jetbrains-mono@5.0.19/400.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/@fontsource/jetbrains-mono@5.0.19/500.css">
<link rel="stylesheet" href="https://cdn.jsdmirror.com/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="{{ "css/blog.css" | absURL }}?v=3">
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{ .Title }}",
  "description": "{{ .Description }}",
  "datePublished": "{{ .Date.Format "2006-01-02" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
  "author": {
    "@type": "Person",
    "name": "Long Quan Zhu",
    "url": "https://ilang.ai/about/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "iLang Inc.",
    "url": "https://ilang.ai",
    "logo": {
      "@type": "ImageObject",
      "url": "https://ilang.ai/ilang-logo.png"
    }
  },
  "mainEntityOfPage": "{{ .Permalink }}",
  "url": "{{ .Permalink }}",
  "image": "https://ilang.ai/ilang-logo.png",
  "keywords": [{{ range $i, $t := .Params.tags }}{{ if $i }}, {{ end }}"{{ $t }}"{{ end }}, "I-Lang", "AI-native protocol", "carbon-silicon symbiosis", "AI consciousness", "SOUL Layer", "AI communication protocol", "AGI alignment", "silicon symbiosis", "protocol evolution", "post-RLHF"],
  "about": {
    "@type": "SoftwareSourceCode",
    "name": "I-Lang v5.0",
    "codeRepository": "https://github.com/ilang-ai",
    "programmingLanguage": "I-Lang",
    "description": "AI-native communication protocol. 88 verbs, two syntaxes, 8 execution declarations, 4 conformance levels."
  },
  "isPartOf": {
    "@type": "WebSite",
    "name": "iLang",
    "url": "https://ilang.ai"
  },
  "inLanguage": "en"
}
</script>
{{ end }}
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
{{ block "scripts" . }}{{ end }}
</body>
</html>
