{{ define "main" }}
<main id="main" class="journal">
<header class="page-hero"><div class="container" data-path="ilang.ai / blog / posts">
  <h1>{{ .Title }}</h1>
</div></header>
<div class="container">
  <div class="posts-list">
    {{ range .Pages }}
    <article class="post-card">
      <div class="post-meta">{{ .Date.Format "2006 · 01 · 02" }}</div>
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      {{ with .Description }}<p class="post-excerpt">{{ . }}</p>{{ end }}
    </article>
    {{ end }}
  </div>
</div>
</main>
{{ end }}
