<script>
// Before first paint: mark that scripts run, put back the reader's own choice of paper or ink, and let the page
// move unless the reader asked for less motion. If the rest of the scripts never arrive, motion is switched off again.
(function(){var d=document.documentElement,c=d.classList;c.remove('no-js');c.add('js');try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches){c.add('anim');window.__ilangSafe=setTimeout(function(){c.remove('anim');},4000);}}catch(e){}try{var t=localStorage.getItem('ilang-theme');if(t==='ink'||t==='paper')d.setAttribute('data-theme',t);}catch(e){}})();
</script>
