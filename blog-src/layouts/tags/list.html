{{ define "main" }}
<main id="main" class="journal tags-page">
<header class="page-hero"><div class="container" data-path="ilang.ai / blog / tags">
  <h1>Topics</h1>
  <p class="sub tags-intro">All topics covered on the iLang Blog. Each tag is a rabbit hole.</p>
</div></header>
<div class="container">
  <div class="tags-cloud">
    {{ range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.Permalink }}" class="tag-pill">
      <span class="tag-name">{{ .Page.Title }}</span>
      <span class="tag-count">{{ .Count }}</span>
    </a>
    {{ end }}
  </div>
</div>
</main>
{{ end }}
